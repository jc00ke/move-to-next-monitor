name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck move-to-next-monitor test/*.sh

  # Runs the script against mocked X11 commands, so no X server is needed.
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Run geometry tests
        run: test/geometry-test.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # xvfb:              headless X server
      # openbox:           minimal EWMH window manager
      # x11-xserver-utils: xrandr
      # x11-utils:         xwininfo, xprop, xdpyinfo, and xmessage (the test window)
      # xdotool, wmctrl:   script dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox x11-xserver-utils x11-utils xdotool wmctrl

      # Starts its own Xvfb with two unequal RandR monitors.
      - name: Run RandR integration test
        run: test/randr-xvfb-test.sh

  # Same tests on Arch, which ships gawk (Ubuntu uses mawk) and newer X11 packages.
  # GitHub has no Arch runners, so the steps run in the official Arch container.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10

    steps:
      # The first line matches the README's Arch instructions.
      # xorg-server-xvfb:  headless X server
      # openbox:           minimal EWMH window manager
      # xorg-xmessage:     the test window
      # xorg-xdpyinfo:     X server readiness check
      # git:               lets actions/checkout clone instead of fetching a tarball
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed xorg-xwininfo xorg-xrandr xorg-xprop xdotool wmctrl
          pacman -S --noconfirm --needed xorg-server-xvfb openbox xorg-xmessage xorg-xdpyinfo git

      - uses: actions/checkout@v5

      - name: Run geometry tests
        run: test/geometry-test.sh

      - name: Run RandR integration test
        run: test/randr-xvfb-test.sh
