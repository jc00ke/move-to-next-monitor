name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck move-to-next-monitor test/*.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # xvfb + xauth:    headless host display for Xephyr (via xvfb-run)
      # xserver-xephyr:  nested X server providing two Xinerama monitors
      # openbox:         minimal EWMH window manager
      # x11-apps:        xeyes, the test window
      # xdotool, wmctrl, x11-utils (xwininfo, xprop, xdpyinfo): script dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xserver-xephyr openbox x11-apps \
            xdotool wmctrl x11-utils

      # Xephyr opens a 2560x720 window, so the host screen must be at least that big.
      - name: Run tests
        run: xvfb-run -a -s "-screen 0 2560x1440x24" test/xephyr-test.sh
